<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Planning Poker logo: a face-down Card with the team's four Jira ticket types (Bug, História,
       Melhoria, Tarefa) along its top edge, and a revealed 8 with a clock as its corner index. The clock
       face takes the page's secondary colour when there is one. The app draws the same logo inline in
       src/client/logo.tsx; this file is the source of the home-screen icon. -->
  <defs>
    <pattern id="back" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#16b3eb"/>
      <rect width="2" height="5" fill="#bcedff"/>
    </pattern>
    <!-- Glyphs drawn at full size around their centre; each <use> shows them at half size. -->
    <g id="bug">
      <path d="M-2.5 -1.4 L-1.1 -0.6 M2.5 -1.4 L1.1 -0.6 M-2.7 0.8 H-1.3 M2.7 0.8 H1.3 M-2.5 3 L-1.1 2.3 M2.5 3 L1.1 2.3" fill="none" stroke="#f76046" stroke-width="1" stroke-linecap="round"/>
      <ellipse cx="0" cy="0.8" rx="1.9" ry="2.6" fill="#f76046"/>
      <circle cx="0" cy="-2.7" r="1.3" fill="#f76046"/>
    </g>
    <path id="story" d="M-2.7 0.6 l1.9 1.9 l3.5 -4" fill="none" stroke="#16b3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="improvement" d="M0 -2.9 V2.9 M-2.9 0 H2.9" fill="none" stroke="#2fb36d" stroke-width="2" stroke-linecap="round"/>
    <g id="task" fill="none" stroke="#7b6cf0" stroke-linecap="round">
      <path d="M-0.8 -2.3 H2.8 M-0.8 0 H2.8 M-0.8 2.3 H2.8" stroke-width="1.5"/>
      <path d="M-2.9 -2.3 h0.1 M-2.9 0 h0.1 M-2.9 2.3 h0.1" stroke-width="1.9"/>
    </g>
    <g id="clock">
      <circle r="3" style="fill: var(--secondary, #bcedff)" stroke="#211f40" stroke-width="1.4"/>
      <path d="M0 0 V-1.9 M0 0 L1.4 0.8" fill="none" stroke="#211f40" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>
  <g stroke="#211f40" stroke-linejoin="round" stroke-linecap="round">
    <!-- The face-down Card, tilted left. -->
    <g transform="translate(23 35) rotate(-14)">
      <rect x="-11.5" y="-17.5" width="28" height="40" rx="5" fill="#211f40" stroke="none"/>
      <rect x="-14" y="-20" width="28" height="40" rx="5" fill="#16b3eb" stroke-width="3"/>
      <rect x="-9" y="-15" width="18" height="30" rx="2.5" fill="url(#back)" stroke-width="2"/>
    </g>
    <!-- The revealed 8, tilted right, with the clock as its corner index. -->
    <g transform="translate(40 31) rotate(10)">
      <rect x="-11.5" y="-17.5" width="28" height="40" rx="5" fill="#211f40" stroke="none"/>
      <rect x="-14" y="-20" width="28" height="40" rx="5" fill="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="-6" r="4.6" fill="none" stroke-width="3.6"/>
      <circle cx="0" cy="5.6" r="6" fill="none" stroke-width="3.6"/>
      <use href="#clock" transform="translate(-9.4 -15.2) scale(0.5)"/>
      <use href="#clock" transform="translate(9.4 15.2) rotate(180) scale(0.5)"/>
    </g>
  </g>
  <!-- The four ticket types, in a row along the face-down Card's top edge. -->
  <g transform="translate(23 35) rotate(-14)">
    <use href="#bug" transform="translate(-10 -24.5) scale(0.5)"/>
    <use href="#story" transform="translate(-4 -24.5) scale(0.5)"/>
    <use href="#improvement" transform="translate(2 -24.5) scale(0.5)"/>
    <use href="#task" transform="translate(8 -24.5) scale(0.5)"/>
  </g>
</svg>
