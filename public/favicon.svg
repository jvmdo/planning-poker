<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 5 57 57">
  <!-- The favicon: the logo's two Cards without the ticket icons and clocks, which turn to specks
       below 32 px. On dark browser tabs the outlines turn cream so the Cards keep their edges. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .outline { stroke: #fef4df; }
      .shadow { fill: #fef4df; opacity: 0.35; }
    }
  </style>
  <defs>
    <pattern id="back" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#16b3eb"/>
      <rect width="2" height="5" fill="#bcedff"/>
    </pattern>
  </defs>
  <g class="outline" stroke="#211f40" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(23 35) rotate(-14)">
      <rect class="shadow" x="-11.5" y="-17.5" width="28" height="40" rx="5" fill="#211f40" stroke="none"/>
      <rect x="-14" y="-20" width="28" height="40" rx="5" fill="#16b3eb" stroke-width="3"/>
      <rect x="-9" y="-15" width="18" height="30" rx="2.5" fill="url(#back)" stroke-width="2"/>
    </g>
    <g transform="translate(40 31) rotate(10)">
      <rect class="shadow" x="-11.5" y="-17.5" width="28" height="40" rx="5" fill="#211f40" stroke="none"/>
      <rect x="-14" y="-20" width="28" height="40" rx="5" fill="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="-6" r="4.6" fill="none" stroke="#211f40" stroke-width="3.6"/>
      <circle cx="0" cy="5.6" r="6" fill="none" stroke="#211f40" stroke-width="3.6"/>
    </g>
  </g>
</svg>
